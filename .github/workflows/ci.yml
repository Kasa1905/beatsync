name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: https://example.com
      NEXT_PUBLIC_WS_URL: wss://example.com/ws
      NEXT_PUBLIC_POSTHOG_KEY: test
      NEXT_PUBLIC_POSTHOG_HOST: https://app.posthog.com
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.2'

      - name: Install dependencies
        run: bun install

      - name: Build monorepo (skip server)
        run: bunx turbo run build --filter='!server'
